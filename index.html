<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tesouraria OBPC — Fluxo de Caixa</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#f7f8f5;--surface:#fcfcfb;--card:#ffffff;--line:#e4e2dc;--ink:#0b0b0b;--ink2:#52514e;--ink3:#8a8984;
  --accent:#1f8a4c;--accent-soft:rgba(0,156,59,.09);--in:#3fae6a;--out:#4a6fb5;--good:#1f8a4c;--bad:#c23b3b;--verde:#009c3b;--amarelo:#ffdf00;--azul:#002776;--vT:rgba(0,156,59,.08);--aT:rgba(255,223,0,.16);--zT:rgba(0,39,118,.07);
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#141413;--surface:#1a1a19;--card:#21211f;--line:#34332f;--ink:#f0efec;--ink2:#c3c2b7;--ink3:#8f8e86;
  --accent:#4fc97a;--accent-soft:#1c3324;--in:#2fb35c;--out:#6f8fe0;--good:#4fbf85;--bad:#e66767}
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
header.top{background:linear-gradient(90deg,rgba(0,156,59,.10),rgba(255,223,0,.10) 55%,rgba(0,39,118,.08));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
header.top::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,rgba(0,156,59,.55),rgba(255,223,0,.65),rgba(0,39,118,.45))}
header.top .brand b{color:var(--ink)}header.top .brand span{color:var(--ink2)}
.top .row{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.2}
.brandwrap{display:flex;align-items:center;gap:10px;margin-right:auto}
#hdLogo{height:58px;width:auto;border-radius:8px;background:rgba(255,255,255,.8);padding:3px 6px}
.paper .hd{position:relative}.paper .hd.lg{padding-left:240px;min-height:84px;text-align:center}.paper .hd img{position:absolute;left:0;top:0;max-height:80px;max-width:230px}
.logoprev{display:flex;gap:14px;align-items:center;margin:6px 0 14px}.logoprev img{max-height:80px;max-width:160px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px}
.brand b{font-size:16px}.brand span{font-size:12px;color:var(--ink2)}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs a{padding:8px 12px;border-radius:8px;text-decoration:none;color:var(--ink2);font-weight:500}
nav.tabs a:hover{background:rgba(255,255,255,.5)}
nav.tabs a.on{background:rgba(255,255,255,.75);color:#1f6b3e;font-weight:650;box-shadow:inset 0 -2px 0 rgba(0,156,59,.5)}
main{max-width:1180px;margin:0 auto;padding:20px}
.banner{background:#fff4d6;color:#5c4400;border:1px solid #f0d78a;border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:14px}
@media (prefers-color-scheme: dark){.banner{background:#3a3115;color:#f3e1a6;border-color:#5c4b17}}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.tile{background:linear-gradient(180deg,var(--vT),transparent 70%),var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.kpis .tile:nth-child(2){background:linear-gradient(180deg,var(--aT),transparent 70%),var(--card)}.kpis .tile:nth-child(3){background:linear-gradient(180deg,var(--zT),transparent 70%),var(--card)}
.tile .lab{font-size:12px;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em}
.tile .val{font-size:26px;font-weight:650;margin-top:4px;font-variant-numeric:tabular-nums}
.tile .sub{font-size:12px;color:var(--ink3)}
.neg{color:var(--bad)}.pos{color:var(--good)}
h2{font-size:18px;margin:26px 0 10px}
h3{font-size:15px;margin:0 0 8px}
.menu{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.mbtn{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;cursor:pointer;transition:border-color .15s,transform .15s}
.mbtn:hover{border-color:rgba(0,156,59,.35);background:linear-gradient(180deg,var(--vT),transparent),var(--card);transform:translateY(-1px)}
.mbtn .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:20px;font-weight:700;flex:none}
.mbtn b{display:block}.mbtn small{color:var(--ink2)}
.ic.in{background:var(--vT);color:#1f8a4c}.ic.out{background:var(--zT);color:#2c4f94}.ic.neu{background:var(--aT);color:#7a6a10}
@media (prefers-color-scheme: dark){.ic.in{background:#1c3324;color:#7fe0a0}.ic.out{background:#1b2440;color:#a9bdf2}.ic.neu{background:#3a3415;color:#ffe766}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card h3{border-left:3px solid rgba(0,156,59,.45);padding-left:8px}
.two{grid-template-columns:3fr 2fr}
@media (max-width:860px){.two{grid-template-columns:1fr}}
.legend{display:flex;gap:16px;font-size:13px;color:var(--ink2);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block}
.tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;box-shadow:0 4px 14px rgba(0,0,0,.12);white-space:nowrap;display:none;z-index:5}
.alerts li{margin-bottom:6px;font-size:14px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .sp{flex:1}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:rgba(0,156,59,.85);border-color:transparent;color:#fff}
.btn.pri:hover{background:rgba(0,140,52,.95)}
@media (prefers-color-scheme: dark){.btn.pri{color:#0d1520}}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:7px 12px;cursor:pointer}
.seg button.on{background:var(--zT);color:#24467f;font-weight:650}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:12px;color:var(--ink2);text-transform:uppercase;letter-spacing:.03em;border-bottom:1px solid var(--line);padding:8px 6px}
table.t td{border-bottom:1px solid var(--line);padding:7px 6px;vertical-align:top}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tfoot td{font-weight:650;border-bottom:0}
.tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:99px;font-weight:600}
.tag.in{background:var(--vT);color:#1f8a4c}.tag.out{background:var(--zT);color:#2c4f94}
@media (prefers-color-scheme: dark){.tag.in{background:#1c3324;color:#7fe0a0}.tag.out{background:#1b2440;color:#a9bdf2}}
.muted{color:var(--ink3)}
.tablewrap{overflow-x:auto}
/* modal */
.ov{position:fixed;inset:0;background:rgba(10,10,10,.45);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:40px 14px;overflow-y:auto}
.ov.show{display:flex}
.modal{background:var(--card);border-radius:16px;width:100%;max-width:640px;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.steps{display:flex;gap:6px;margin-bottom:16px}
.steps span{flex:1;height:4px;border-radius:4px;background:var(--line)}
.steps span.on{background:rgba(0,156,59,.55)}.steps span.on:nth-child(2){background:rgba(230,200,0,.6)}.steps span.on:nth-child(3){background:rgba(0,39,118,.45)}
.choice{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.choice button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;text-align:left;cursor:pointer}
.choice button:hover,.choice button.on{border-color:var(--accent);background:var(--accent-soft)}
.choice b{display:block}.choice small{color:var(--ink2)}
.form{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink2)}
.form .full{grid-column:1/-1}
.form input,.form select,.form textarea{color:var(--ink);font-size:15px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.mfoot .sp{flex:1}
.hint{font-size:13px;background:var(--aT);color:#5a4d00;border-left:3px solid rgba(230,200,0,.6);border-radius:8px;padding:8px 10px}
.review dl{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;margin:0}
.review dt{color:var(--ink2)}.review dd{margin:0;font-weight:500}
.check{display:flex;gap:8px;align-items:center;margin-top:14px}
/* paper */
.paper{background:#fff;color:#111;border:1px solid #ddd;border-radius:6px;padding:34px 38px;max-width:820px;margin:0 auto;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.paper .hd{text-align:center;border-bottom:2px solid rgba(0,156,59,.45);box-shadow:0 2px 0 rgba(255,223,0,.5);padding-bottom:10px;margin-bottom:18px}
.paper .hd b{color:#1f3f78}
.paper .hd b{font-size:15px;display:block}.paper .hd span{font-size:12.5px;display:block;color:#333}
.paper .meta{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:14px;flex-wrap:wrap;gap:6px}
.paper table{width:100%;border-collapse:collapse;font-size:13.5px;margin-bottom:14px}
.paper th{background:rgba(0,156,59,.12);color:#1d5a35;text-align:left;padding:6px 8px;border:1px solid #d9e6dd;font-size:12.5px;text-transform:uppercase}
.paper td{padding:5px 8px;border:1px solid #ddd}
.paper td.n.neg{color:#c23b3b!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.paper td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.paper tr.sub td{background:rgba(255,223,0,.12);font-weight:600}
.paper tr.tot td{background:rgba(0,39,118,.08);color:#1f3f78;font-weight:700}
.paper .sign{display:flex;justify-content:space-around;margin-top:46px;font-size:12.5px;text-align:center;gap:20px}
.paper .sign div{border-top:1px solid #111;padding-top:4px;min-width:220px}
.paper .city{margin-top:22px;font-size:13.5px}
.paper .rec{border:1.5px solid rgba(0,156,59,.4);border-top:4px solid rgba(0,156,59,.45);background:linear-gradient(180deg,rgba(0,156,59,.04),transparent 40%);border-radius:6px;padding:20px 24px;margin-bottom:18px}
.paper .rec .rt{color:#1f3f78;display:flex;justify-content:space-between;align-items:center;font-size:20px;font-weight:700;margin-bottom:14px}
.paper .rec .rv{border:1.5px solid rgba(0,39,118,.35);color:#1f3f78;background:rgba(255,223,0,.14);padding:4px 12px;border-radius:4px}
.paper .rec p{font-size:14.5px;line-height:1.7;text-align:justify}
.paper .via{font-size:11px;color:#666;text-align:right}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:80;display:none}
.empty{padding:30px;text-align:center;color:var(--ink3)}
.form .check{flex-direction:row;align-items:center;gap:10px;color:var(--ink);font-size:14.5px}
.form .check input{width:18px;height:18px}
#pacotePrint{position:absolute;left:-99999px;top:0;width:820px}
#pacotePrint .paper{box-shadow:none;border:0;margin:0 0 20px}
@media print{#pacotePrint .paper{break-after:page;page-break-after:always;max-width:none;padding:0}#pacotePrint .paper:last-child{break-after:auto;page-break-after:auto}}

.menu{grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.menu .mbtn{padding:10px 12px;gap:10px;min-width:0}
.menu .mbtn .ic{width:32px;height:32px;font-size:16px;border-radius:8px}
.menu .mbtn b{font-size:14px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu .mbtn small{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.menu .mbtn>span:last-child{min-width:0}
@media (max-width:980px){.menu{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:520px){.menu{grid-template-columns:repeat(2,minmax(0,1fr))}}

.alerts{padding-left:0;list-style:none;margin:0}
.alerts li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.alerts li:last-child{border-bottom:0}
.alerts li button{flex:none}
.alerts li .acts{display:flex;gap:6px;flex:none}
details.disp{margin-top:10px;font-size:13.5px}
details.disp summary{cursor:pointer;color:var(--ink2)}
details.disp .alerts li{font-size:13.5px}
table.t tr.hl td{background:rgba(255,223,0,.22)}
table.t tr.hl td:first-child{box-shadow:inset 3px 0 0 #e0b800}

.salmo{display:flex;align-items:center;gap:14px;background:linear-gradient(90deg,rgba(0,156,59,.07),rgba(255,223,0,.10),rgba(0,39,118,.06)),var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;margin-bottom:14px}
.salmo .sic{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(255,223,0,.22);color:#7a6a10;font-size:18px}
.salmo .stx{flex:1;transition:opacity .6s}
.salmo .stx.fade{opacity:0}
.salmo q{font-style:italic;font-size:15.5px;color:var(--ink);quotes:"“" "”"}
.salmo .sref{display:block;font-size:12.5px;color:var(--ink2);margin-top:3px;font-weight:600}
.salmo .snav{flex:none;display:flex;gap:4px}
.salmo .snav button{border:1px solid var(--line);background:transparent;border-radius:8px;width:30px;height:30px;cursor:pointer;color:var(--ink2)}
.salmo .snav button:hover{border-color:rgba(0,156,59,.45)}
@media print{.salmo{display:none}}

.periodo{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin-bottom:14px;display:flex;flex-direction:column;gap:8px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:500;color:var(--ink2);position:relative}
.pills button:hover{border-color:rgba(0,156,59,.45)}
.pills.anos button{font-weight:650}
.pills button.on{background:rgba(0,156,59,.14);border-color:rgba(0,156,59,.55);color:#16653a;font-weight:700}
.pills.anos button.on{background:rgba(0,39,118,.10);border-color:rgba(0,39,118,.45);color:#1f3f78}
.pills button.vazio{color:var(--ink3);background:transparent;border-style:dashed}
.pills button.hoje::after{content:'';position:absolute;top:3px;right:5px;width:6px;height:6px;border-radius:50%;background:#e0b800}
.pills.anos{flex-wrap:nowrap}
.pills.meses{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;padding:4px 2px 8px;scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:rgba(0,156,59,.35) transparent}
.pills.meses::-webkit-scrollbar{height:6px}.pills.meses::-webkit-scrollbar-thumb{background:rgba(0,156,59,.35);border-radius:6px}
.pills.meses button{flex:none;min-width:64px}

#login{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(0,156,59,.10),rgba(255,223,0,.12),rgba(0,39,118,.10)),var(--bg);padding:20px}
#login[hidden]{display:none}
#login .box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px;width:100%;max-width:380px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
#login img{display:block;max-width:220px;margin:0 auto 14px}
#login h2{text-align:center;margin:0 0 16px;font-size:18px}
#login label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink2);margin-bottom:12px}
#login .btn{width:100%;padding:10px}
#login .lk{background:none;border:0;color:var(--accent);cursor:pointer;margin-top:10px;width:100%;font-size:13px}
#login label[hidden]{display:none}
#login .lgUsers{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
#login .lgT{font-size:13px;color:var(--ink2)}
#login .lgUsers button{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;cursor:pointer;font-weight:600;text-align:left}
#login .lgUsers button:hover{border-color:rgba(0,156,59,.45)}
#login .lgUsers button.on{border-color:rgba(0,156,59,.7);background:rgba(0,156,59,.10)}
#login .lgUsers .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(0,39,118,.10);color:#1f3f78;font-size:12px;font-weight:700}
#login .lgUsers button.outro{font-weight:500;color:var(--ink2);justify-content:center;border-style:dashed}
#lgMsg{text-align:center;font-size:13px;color:var(--ink2);min-height:18px;margin-top:8px}
#sair{margin-left:6px}
@media print{
  body *{visibility:hidden!important}
  .printarea,.printarea *{visibility:visible!important}
  .printarea{position:absolute;left:0;top:0;width:100%;max-width:none;border:0;box-shadow:none;margin:0;padding:10mm 12mm}
  .ov{position:static;background:none;padding:0}
  @page{size:A4;margin:8mm}
  .paper th,.paper tr.sub td,.paper tr.tot td,.paper .rec,.paper .rec .rv{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<header class="top"><div class="row">
  <div class="brandwrap"><img id="hdLogo" alt="" hidden><div class="brand"><b id="hdNome">Tesouraria</b><span id="hdSub">Fluxo de caixa</span></div></div>
  <nav class="tabs" id="tabs">
    <a href="#inicio" data-v="inicio">Início</a>
    <a href="#lancamentos" data-v="lancamentos">Lançamentos</a>
    <a href="#relatorios" data-v="relatorios">Relatórios</a>
    <a href="#recibos" data-v="recibos">Recibos</a>
    <a href="#configuracoes" data-v="configuracoes">Configurações</a>
  </nav>
  <button class="btn sm" id="sair" hidden>Sair</button>
</div></header>
<div id="login" hidden><form class="box" id="lgForm">
  <img id="lgLogo" alt="">
  <h2>Tesouraria — acesso restrito</h2>
  <div class="lgUsers" id="lgUsers"></div>
  <label id="lgEmailL" hidden>E-mail<input type="email" id="lgEmail" autocomplete="username"></label>
  <label>Senha<input type="password" id="lgSenha" required autocomplete="current-password"></label>
  <button class="btn pri" type="submit">Entrar</button>
  <button class="lk" type="button" id="lgEsqueci">Esqueci minha senha</button>
  <div id="lgMsg"></div>
</form></div>
<main>
  <div class="salmo" id="salmo" aria-live="polite"><span class="sic">✦</span><div class="stx" id="salmoTx"></div>
    <div class="snav"><button type="button" id="salmoAnt" title="Salmo anterior">‹</button><button type="button" id="salmoProx" title="Próximo salmo">›</button></div></div>
  <div id="banner"></div>
  <section id="v-inicio"></section>
  <section id="v-lancamentos" hidden></section>
  <section id="v-relatorios" hidden></section>
  <section id="v-recibos" hidden></section>
  <section id="v-configuracoes" hidden></section>
</main>
<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
// ====== CONFIGURAÇÃO DO SUPABASE — preencha com os dados do seu projeto ======
// Supabase > Project Settings > API: copie "Project URL" e a chave "anon public".
const SUPABASE_URL='https://jivsdawzmovfordlduly.supabase.co';

function parseValor(s){s=String(s).trim().replace(/[R$\s]/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return r2(parseFloat(s))}

function extenso(v){
  v=r2(v);const un=['','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
  const dz=['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
  const ct=['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
  const ate999=n=>{if(n===0)return'';if(n===100)return'cem';const c=Math.floor(n/100),r=n%100,p=[];if(c)p.push(ct[c]);if(r){if(r<20)p.push(un[r]);else{const d=Math.floor(r/10),u=r%10;p.push(u?dz[d]+' e '+un[u]:dz[d])}}return p.join(' e ')};
  const inteiro=Math.floor(v),cent=Math.round((v-inteiro)*100);
  const grupo=n=>{if(n===0)return'zero';const mi=Math.floor(n/1e6),mil=Math.floor(n%1e6/1000),r=n%1000,p=[];
    if(mi)p.push(mi===1?'um milhão':ate999(mi)+' milhões');
    if(mil)p.push(mil===1?'mil':ate999(mil)+' mil');
    if(r)p.push(ate999(r));
    if(p.length===1)return p[0];
    const ult=p.pop();const e=!r||r<100||r%100===0;return p.join(' ')+(e?' e ':' ')+ult};
  let s='';
  if(inteiro>0){s=grupo(inteiro);s+=(inteiro===1?' real':(inteiro%1e6===0?' de reais':' reais'))}
  if(cent>0){s+=(s?' e ':'')+ate999(cent)+(cent===1?' centavo':' centavos')}
  return s||'zero reais';
}

const limpa=r=>{const o={id:r.id};COLS.forEach(k=>{if(r[k]!==null&&r[k]!==undefined&&r[k]!=='')o[k]=k==='valor'?+r[k]:r[k]});return o};
async function carregarTudo(){
  const todos=[];let de=0;const passo=1000;
  for(;;){const {data,error}=await sb.from('lancamentos').select('*').order('id').range(de,de+passo-1);
    if(error)throw error;todos.push(...data);if(data.length<passo)break;de+=passo}
  items=todos.map(limpa);
  const {data:c}=await sb.from('config').select('dados').eq('id','geral').maybeSingle();
  cfg={...DEF_CFG,...((c&&c.dados)||{})};
  renderAll();
}
let recarregarT;function recarregarDepois(){clearTimeout(recarregarT);recarregarT=setTimeout(()=>carregarTudo().catch(()=>{}),400)}
async function salvarItem(id,data){
  if(mode==='db'){
    const row={id:id||crypto.randomUUID()};COLS.forEach(k=>row[k]=data[k]===undefined||data[k]===''?null:data[k]);
    if(semColAtualizado)delete row.atualizado;
    let {error}=await sb.from('lancamentos').upsert(row);
    if(error&&/atualizado/i.test(error.message||'')){semColAtualizado=true;delete row.atualizado;({error}=await sb.from('lancamentos').upsert(row));
      toast('Aviso: rode no Supabase o comando da coluna "atualizado" (veja o LEIAME) para a ordem por edição funcionar.',6000)}
    if(error)throw error;
    const i=items.findIndex(x=>x.id===row.id);const n=limpa(row);if(i>=0)items[i]=n;else items.push(n);renderAll();return row.id;
  }
  if(!id){id='l'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);items.push({id,...data})}
  else{const i=items.findIndex(x=>x.id===id);if(i>=0)items[i]={id,...data};else items.push({id,...data})}
  lsSave();renderAll();return id;
}
async function excluirItem(id){
  if(mode==='db'){const {error}=await sb.from('lancamentos').delete().eq('id',id);if(error)throw error;items=items.filter(x=>x.id!==id);renderAll();return}
  items=items.filter(x=>x.id!==id);lsSave();renderAll();
}
async function salvarCfg(c){
  cfg={...cfg,...c};
  if(mode==='db'){const d={...cfg};if(d.logo===LOGO_PADRAO)delete d.logo;const {error}=await sb.from('config').upsert({id:'geral',dados:d});if(error)throw error;renderAll()}
  else{lsSave();renderAll()}
}

let jaLogado=false;
async function aposLogin(session){
  if(jaLogado)return;jaLogado=true;
  zerarInatividade();
  $('#login').hidden=true;$('#sair').hidden=false;$('#sair').title=session.user.email;
  mode='loading';renderBanner();
  const lento=setTimeout(()=>{if(mode==='loading'){$('#banner').innerHTML='<div class="banner">Os dados estão demorando para carregar. Se o projeto do Supabase estiver pausado, entre em supabase.com e clique em <b>Restore project</b>; depois recarregue esta página.</div>'}},12000);
  try{await carregarTudo();mode='db'}catch(e){mode='db';toast('Erro ao carregar dados: '+(e.message||e))}
  clearTimeout(lento);
  renderBanner();
  sb.channel('mudancas').on('postgres_changes',{event:'*',schema:'public',table:'lancamentos'},recarregarDepois)
    .on('postgres_changes',{event:'*',schema:'public',table:'config'},recarregarDepois).subscribe();
}
async function init(){
  dl=true;
  if(!sb){mode='local';lsLoad();renderBanner();renderAll();return}
  $('#sair').onclick=async()=>{await sb.auth.signOut();location.reload()};
  const {data:{session}}=await sb.auth.getSession();
  sb.auth.onAuthStateChange((ev,ses)=>{
    if(ev==='PASSWORD_RECOVERY'){novaSenha()}
    else if(ev==='SIGNED_IN'&&ses&&!jaLogado)setTimeout(()=>aposLogin(ses),0);
  });
  if(session)aposLogin(session);else{mode='loading';renderBanner();const msg=sessionStorage.getItem('obpc-msg');sessionStorage.removeItem('obpc-msg');telaLogin(msg||'')}
}

// ---------- cálculos ----------
const doMes=m=>items.filter(x=>x.mes===m);
// Ordem: mês → entradas antes das saídas → última inclusão/edição primeiro (mais recente no topo do grupo) → data → id
const ord=(a,b)=>(a.mes||'').localeCompare(b.mes||'')||((a.tipo==='saida')-(b.tipo==='saida'))||(b.atualizado||'').localeCompare(a.atualizado||'')||((a.data||'')+a.id).localeCompare((b.data||'')+b.id);
function mesesComDados(){const s=new Set(items.map(x=>x.mes));s.add(mesAtual());return [...s].filter(Boolean).sort()}
function totMes(m){let e=0,s=0;for(const x of items)if(x.mes===m){if(x.tipo==='entrada')e+=+x.valor||0;else s+=+x.valor||0}return{e:r2(e),s:r2(s),l:r2(e-s)}}
function saldoAnterior(m){let v=+cfg.saldoInicial||0;const ms=new Set(items.map(x=>x.mes));for(const k of ms){if(k>=cfg.saldoInicialMes&&k<m)v+=totMes(k).l}return r2(v)}
function resumo(m){
  const it=doMes(m).sort(ord);const ent={};CAT_E.forEach(c=>ent[c.n]=0);
  it.filter(x=>x.tipo==='entrada').forEach(x=>{ent[x.categoria]=(ent[x.categoria]||0)+(+x.valor||0)});
  const said=it.filter(x=>x.tipo==='saida');const t=totMes(m);const ant=saldoAnterior(m);
  const diz=new Set(it.filter(x=>x.categoria==='Dízimos').map(x=>(x.pessoa||'').trim().toUpperCase()).filter(Boolean));
  return{it,ent,said,te:t.e,ts:t.s,sm:t.l,ant,fin:r2(ant+t.l),nDiz:diz.size,dizDiz:r2(((ent['Dízimos']||0)+(ent['Ofertas']||0))*0.1)};
}
function proxRecibo(){let m=0;items.forEach(x=>{if(+x.recibo>m)m=+x.recibo});return m+1}
function pendencias(){
  const out=[];const byMes={};
  items.forEach(x=>{(byMes[x.mes]=byMes[x.mes]||[]).push(x)});
  for(const m of Object.keys(byMes).sort()){
    const seen={};
    byMes[m].filter(x=>x.categoria==='Dízimos').forEach(x=>{const k=(x.pessoa||'').toUpperCase()+'|'+x.valor;
      if(seen[k])out.push({k:'dup|'+[seen[k],x.id].sort().join(','),t:`${mesNome(m)}: dízimo de <b>${esc(x.pessoa)}</b> (${brl(x.valor)}) aparece duas vezes — confira se é repetido.`,mes:m,ids:[seen[k],x.id]});
      else seen[k]=x.id});
    byMes[m].filter(x=>/sem descrição/i.test(x.descricao||'')).forEach(x=>out.push({k:'sd|'+x.id,t:`${mesNome(m)}: entrada de ${brl(x.valor)} sem descrição.`,mes:m,ids:[x.id]}));
    const pm=prevMes(m);if(byMes[pm]&&m<=mesAtual()){
      const esperado=resumo(pm).dizDiz;const pg=byMes[m].filter(x=>/d[íi]zimo dos d[íi]zimos/i.test(x.descricao||''));const pago=pg.reduce((a,x)=>a+(+x.valor||0),0);
      if(m<mesAtual()&&Math.abs(pago-esperado)>0.05)out.push({k:'dd|'+m+'|'+pago.toFixed(2)+'|'+esperado.toFixed(2),t:`${mesNome(m)}: dízimo dos dízimos pago ${brl(pago)}; 10% de ${mesNome(pm)} seria ${brl(esperado)}.`,mes:m,ids:pg.map(x=>x.id),tipo:pg.length?'':'saida'});
    }
  }
  return out;
}
function irParaPendencia(p){
  S.mesLanc=p.mes;S.tipoLanc=p.tipo||'';S.busca='';S.destaque=new Set(p.ids||[]);S.rolarDestaque=true;
  if(location.hash==='#lancamentos')setView('lancamentos');else location.hash='#lancamentos';

function anosDisponiveis(){
  const ys=mesesComDados().map(m=>+m.slice(0,4)).concat([+mesAtual().slice(0,4),+String(cfg.saldoInicialMes||'2026').slice(0,4),2026,2027]);
  const ini=Math.min(...ys),fim=Math.max(...ys);const out=[];for(let y=ini;y<=fim;y++)out.push(String(y));return out}

function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p}
function drawBars(sel,mm){
  const el=$(sel);if(!mm.length){el.innerHTML='<div class="empty">Sem dados</div>';return}
  const W=640,H=260,L=56,R=10,T=10,B=28;const data=mm.map(m=>({m,...totMes(m)}));
  const max=niceMax(Math.max(...data.map(d=>Math.max(d.e,d.s))));const gw=(W-L-R)/data.length;const bw=Math.min(18,(gw-10)/2);
  const y=v=>T+(H-T-B)*(1-v/max);
  const bar=(x,v,c)=>{const yy=y(v),h=H-B-yy;if(h<=0)return'';const r=Math.min(4,h);return `<path d="M${x},${H-B}V${yy+r}q0,-${r} ${r},-${r}h${bw-2*r}q${r},0 ${r},${r}V${H-B}Z" fill="${c}"/>`};
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Entradas e saídas por mês">`;
  for(let i=0;i<=4;i++){const v=max*i/4;s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" font-size="11" text-anchor="end" fill="var(--ink3)">${(v/1000).toLocaleString('pt-BR')}k</text>`}
  data.forEach((d,i)=>{const cx=L+gw*i+gw/2;s+=bar(cx-bw-1,d.e,'var(--in)')+bar(cx+1,d.s,'var(--out)');
    s+=`<text x="${cx}" y="${H-8}" font-size="11" text-anchor="middle" fill="var(--ink2)">${MESES[+d.m.slice(5)-1].slice(0,3)}</text>`;
    s+=`<rect x="${L+gw*i}" y="${T}" width="${gw}" height="${H-T-B}" fill="transparent" data-i="${i}"/>`});
  s+='</svg><div class="tip"></div>';el.innerHTML=s;
  const tip=el.querySelector('.tip');
  el.querySelectorAll('rect[data-i]').forEach(r=>{r.onmousemove=ev=>{const d=data[r.dataset.i];tip.innerHTML=`<b>${mesNome(d.m)}</b><br><span style="color:var(--in)">■</span> Entradas ${brl(d.e)}<br><span style="color:var(--out)">■</span> Saídas ${brl(d.s)}<br>Resultado <b>${brl(d.l)}</b>`;
    const bb=el.getBoundingClientRect();tip.style.display='block';let x=ev.clientX-bb.left+12;if(x>bb.width-180)x-=200;tip.style.left=x+'px';tip.style.top=(ev.clientY-bb.top-20)+'px'};r.onmouseleave=()=>tip.style.display='none'});

function drawSaldo(sel,mm){
  const el=$(sel);if(!mm.length){el.innerHTML='<div class="empty">Sem dados</div>';return}
  const W=440,H=260,L=56,R=14,T=14,B=28;const data=mm.map(m=>({m,v:saldoAnterior(m)+totMes(m).l}));
  const vals=data.map(d=>d.v).concat([0]);let mx=Math.max(...vals),mn=Math.min(...vals);const pad=(mx-mn)*.1||100;mx+=pad;mn-=pad;
  const x=i=>L+(W-L-R)*(data.length===1?.5:i/(data.length-1));const y=v=>T+(H-T-B)*(mx-v)/(mx-mn);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Saldo em depósito">`;
  for(let i=0;i<=4;i++){const v=mn+(mx-mn)*i/4;s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" font-size="11" text-anchor="end" fill="var(--ink3)">${(v/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})}k</text>`}
  s+=`<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--ink3)" stroke-dasharray="4 3"/>`;
  s+=`<path d="${data.map((d,i)=>(i?'L':'M')+x(i)+','+y(d.v)).join('')}" fill="none" stroke="var(--in)" stroke-width="2"/>`;
  data.forEach((d,i)=>{s+=`<circle cx="${x(i)}" cy="${y(d.v)}" r="4" fill="var(--in)" stroke="var(--card)" stroke-width="2"/><text x="${x(i)}" y="${H-8}" font-size="11" text-anchor="middle" fill="var(--ink2)">${MESES[+d.m.slice(5)-1].slice(0,3)}</text><rect x="${x(i)-14}" y="${T}" width="28" height="${H-T-B}" fill="transparent" data-i="${i}"/>`});
  const last=data[data.length-1];s+=`<text x="${x(data.length-1)-6}" y="${y(last.v)-10}" font-size="12" text-anchor="end" fill="var(--ink)" font-weight="600">${brl(last.v)}</text>`;
  s+='</svg><div class="tip"></div>';el.innerHTML=s;const tip=el.querySelector('.tip');
  el.querySelectorAll('rect[data-i]').forEach(r=>{r.onmousemove=ev=>{const d=data[r.dataset.i];tip.innerHTML=`<b>${mesNome(d.m)}</b><br>Saldo ${brl(d.v)}`;const bb=el.getBoundingClientRect();tip.style.display='block';let xx=ev.clientX-bb.left+12;if(xx>bb.width-140)xx-=160;tip.style.left=xx+'px';tip.style.top=(ev.clientY-bb.top-20)+'px'};r.onmouseleave=()=>tip.style.display='none'});
}

  ${it.map(x=>`<tr class="${S.destaque&&S.destaque.has(x.id)?'hl':''}"><td>${x.data?dataBR(x.data):'<span class="muted">'+MESES[+x.mes.slice(5)-1].slice(0,3)+'/'+x.mes.slice(2,4)+'</span>'}</td>

function wizard(pre,step){

function stepBar(){return '<div class="steps">'+[1,2,3,4].map(i=>`<span class="${i<=W.step?'on':''}"></span>`).join('')+'</div>'}
function sugestoes(campo,filtro){const s=new Set();items.forEach(x=>{if(filtro(x)&&x[campo])s.add(x[campo])});return [...s].sort()}

    openModal(h);$('#modal').querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{W.categoria=b.dataset.c;W.step=3;renderWizard()});
  }else if(W.step===3){

function mostrarRecibo(x){
  openModal(`<h3>Recibo nº ${String(x.recibo).padStart(4,'0')}</h3><div style="max-height:60vh;overflow:auto;margin:10px -6px">${reciboHTML(x)}</div>
   <div class="mfoot"><button class="btn danger" id="recX">Excluir recibo</button><span class="sp"></span><button class="btn" id="recF">Fechar</button><button class="btn" id="recI">Imprimir</button><button class="btn pri" id="recP">Baixar PDF</button></div>`);
  $('#recF').onclick=closeModal;$('#recX').onclick=()=>confirmExcluirRecibo(x.id);$('#recP').onclick=()=>pdfRecibo(x);$('#recI').onclick=()=>imprimir($('#modal .paper'));

function confirmExcluirRecibo(id){
  const x=items.find(i=>i.id===id);if(!x||!x.recibo)return;const n=String(x.recibo).padStart(4,'0');
  openModal(`<h3>Excluir o recibo nº ${n}?</h3><p>${esc(x.descricao)}${x.pessoa?' — '+esc(x.pessoa):''} — <b>${brl(x.valor)}</b> (${mesNome(x.mes)})</p>
  <p class="muted">Só o recibo é excluído: a saída continua lançada no caixa e entra nos relatórios normalmente. Se precisar, dá para gerar um recibo novo depois.</p>
  <div class="mfoot"><button class="btn" id="confN">Cancelar</button><button class="btn pri" id="confS" style="background:var(--bad);border-color:var(--bad)">Excluir recibo</button></div>`);
  $('#confN').onclick=closeModal;
  $('#confS').onclick=async()=>{const d={...x};delete d.id;delete d.recibo;
    try{await salvarItem(id,d);closeModal();toast('Recibo nº '+n+' excluído')}catch(e){toast('Não foi possível excluir o recibo')}};
}
async function abrirRecibo(id){
  const x=items.find(i=>i.id===id);if(!x)return;
  if(!x.recibo){const n=proxRecibo();try{const d={...x};delete d.id;d.recibo=n;await salvarItem(id,d);x.recibo=n}catch(e){toast('Não foi possível numerar o recibo');return}}
  mostrarRecibo(x);
}
function rRec(){

function carregarLogo(file){
  const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=async()=>{
    let max=400,url,w,h;
    for(let i=0;i<4;i++){const k=Math.min(1,max/Math.max(img.width,img.height));w=Math.round(img.width*k);h=Math.round(img.height*k);
      const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);url=c.toDataURL('image/png');if(url.length<180000)break;max=Math.round(max*0.75)}
    try{await salvarCfg({logo:url,logoW:w,logoH:h});toast('Logo salva')}catch(e){toast('Não foi possível salvar a logo')}};
    img.onerror=()=>toast('Arquivo de imagem inválido');img.src=rd.result};rd.readAsDataURL(file);
}

function mesesDoAno(a){return [...new Set(items.map(x=>x.mes))].filter(m=>m&&m.startsWith(a)).sort()}
function anosComDados(){return [...new Set(items.map(x=>x.mes.slice(0,4)))].sort()}
function pacoteLista(o){
  const anos=o.ano==='todos'?anosComDados():[o.ano];const out=[];
  anos.forEach(a=>{const ms=mesesDoAno(a);if(!ms.length)return;
    if(o.anual)out.push({k:'anual',a});
    ms.forEach(m=>{if(o.res)out.push({k:'resumido',m});if(o.ana)out.push({k:'analitico',m})})});
  return out;
}
